upstream moli_backend {
    server 127.0.0.1:8888;
    keepalive 32;
}

upstream moli_knowledge {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name moli-ui.wu-jinsen.com;

    root /opt/moli/frontend/dist;
    index index.html;

    error_page 405 = @moli_backend;
    error_page 419 = @login_spa;

    location = /login {
        if ($request_method = POST) {
            return 405;
        }
        return 419;
    }

    location = /system-select {
        return 419;
    }

    # 关键：跳到 /，不要跳到 /index.html
    location @login_spa {
        rewrite ^ / last;
    }

    location @moli_backend {
        proxy_pass http://moli_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header token $http_token;
        proxy_set_header Accept-Language $http_accept_language;
    }

    location /KnowledgeServer/ {
        proxy_pass http://moli_knowledge/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header token $http_token;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_read_timeout 300s;
    }

    location ~ ^/(logout|captchaImage|menu|user|system|sso|dept|post|role|action|auth|dict|log|operation|cockpit|bi|persona)(/|$) {
        set $spa_fallback 0;
        if ($request_method ~ ^(GET|HEAD)$) {
            set $spa_fallback 1;
        }
        if ($http_accept ~* text/html) {
            set $spa_fallback "${spa_fallback}1";
        }
        if ($spa_fallback = 11) {
            return 419;
        }

        proxy_pass http://moli_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header token $http_token;
        proxy_set_header Accept-Language $http_accept_language;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name bioscope3d.wu-jinsen.com;

    root /opt/bioscope3d/page-dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|wasm|mp4|webm|json|glb|gltf)$ {
        expires 7d;
        access_log off;
    }
}
